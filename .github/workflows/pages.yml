name: Deploy static site to IONOS (and GitHub Pages redirect)

on:
  push:
    branches: [main]
  # Belegungskalender stündlich aktualisieren.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Belegungskalender übernehmen
        # Quellen: belegung.ics im Branch kalender-daten (Hermes, führend) und der
        # öffentliche Kalender von ferienhausmiete.de. Veröffentlicht werden
        # ausschließlich Zeiträume (DTSTART/DTEND), keine Namen oder sonstigen Angaben.
        #   kalender/hermes.ics   – nur Hermes (Import-Adresse für ferienhausmiete.de)
        #   kalender/belegung.ics – Hermes + ferienhausmiete.de (Kalender auf der Website)
        run: |
          if git fetch --depth=1 origin kalender-daten 2>/dev/null && git show FETCH_HEAD:belegung.ics > /tmp/hermes-roh.ics 2>/dev/null; then
            echo "Quelle Hermes: Branch kalender-daten"
          else
            echo "Quelle Hermes nicht verfügbar"; : > /tmp/hermes-roh.ics
          fi
          if curl -fsS --max-time 30 -o /tmp/fhm-roh.ics https://www.ferienhausmiete.de/41336.ics; then
            echo "Quelle ferienhausmiete.de: abgerufen"
          else
            echo "Quelle ferienhausmiete.de nicht erreichbar"; : > /tmp/fhm-roh.ics
          fi
          mkdir -p kalender
          python3 - <<'PY'
          import re
          def zeitraeume(pfad):
              raw = open(pfad, encoding="utf-8", errors="ignore").read()
              raw = re.sub(r"\r?\n[ \t]", "", raw)
              out = set()
              for event in re.findall(r"BEGIN:VEVENT(.*?)END:VEVENT", raw, re.S):
                  start = re.search(r"^DTSTART[^:\r\n]*:(\d{8})", event, re.M)
                  end = re.search(r"^DTEND[^:\r\n]*:(\d{8})", event, re.M)
                  if start and end:
                      out.add((start.group(1), end.group(1)))
              return out
          def schreiben(pfad, perioden, name):
              lines = ["BEGIN:VCALENDAR", "VERSION:2.0", f"PRODID:-//Gaestehaus Perschall//{name}//DE",
                       "X-WR-CALNAME:Gästehaus Perschall – Belegung"]
              for i, (s, e) in enumerate(sorted(perioden)):
                  lines += ["BEGIN:VEVENT", f"UID:{s}-{e}@gaestehaus-perschall.com",
                            "DTSTAMP:20260101T000000Z", f"DTSTART;VALUE=DATE:{s}",
                            f"DTEND;VALUE=DATE:{e}", "SUMMARY:Belegt", "END:VEVENT"]
              lines.append("END:VCALENDAR")
              open(pfad, "w", encoding="utf-8", newline="\r\n").write("\n".join(lines) + "\n")
          hermes = zeitraeume("/tmp/hermes-roh.ics")
          fhm = zeitraeume("/tmp/fhm-roh.ics")
          if hermes:
              schreiben("kalender/hermes.ics", hermes, "Hermes")
          schreiben("kalender/belegung.ics", hermes | fhm, "Belegung")
          print(f"Hermes: {len(hermes)}, ferienhausmiete.de: {len(fhm)}, Website gesamt: {len(hermes | fhm)}")
          PY
      - name: Auf IONOS-Webspace hochladen (SFTP)
        # Zugangsdaten nur als GitHub-Secrets (Settings → Secrets and variables → Actions).
        # Ohne Secrets bricht der Lauf hier ab, die GitHub-Pages-Seite bleibt dann unverändert.
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::IONOS-Secrets fehlen (IONOS_SFTP_HOST, IONOS_SFTP_USER, IONOS_SFTP_PASSWORD)."
            exit 1
          fi
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp >/dev/null
          mkdir -p ~/.ssh && ssh-keyscan -T 20 "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "
            set net:max-retries 3; set net:timeout 30;
            mirror --reverse --delete --no-perms --verbose=1 \
              --exclude-glob .git* --exclude ^\.github/ --exclude ^scripts/ \
              --exclude ^logs/ --exclude-glob *.md \
              ./ ./;
            bye"
      - name: GitHub-Pages-Weiterleitung zur eigenen Domain erzeugen
        run: |
          mkdir -p _redirect
          cat > _redirect/index.html <<'HTML'
          <!doctype html>
          <html lang="de"><head><meta charset="utf-8">
          <title>Gästehaus Perschall</title>
          <link rel="canonical" href="https://gaestehaus-perschall.com/">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=https://gaestehaus-perschall.com/">
          <script>location.replace("https://gaestehaus-perschall.com" + location.pathname.replace(/^\/gaestehaus-perschall/, "") + location.hash);</script>
          </head><body><p>Die Website ist umgezogen: <a href="https://gaestehaus-perschall.com/">gaestehaus-perschall.com</a></p></body></html>
          HTML
          cp _redirect/index.html _redirect/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _redirect
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
