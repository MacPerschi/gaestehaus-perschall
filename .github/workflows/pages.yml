name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  # Belegungskalender stündlich aktualisieren.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Belegungskalender übernehmen
        # Quelle: belegung.ics im Branch kalender-daten (Hermes), sonst der öffentliche
        # Kalender von ferienhausmiete.de. Veröffentlicht werden ausschließlich
        # Zeiträume (DTSTART/DTEND), keine Namen oder sonstigen Angaben.
        run: |
          if git fetch --depth=1 origin kalender-daten 2>/dev/null && git show FETCH_HEAD:belegung.ics > /tmp/belegung-roh.ics 2>/dev/null; then
            echo "Quelle: Hermes (Branch kalender-daten)"
          elif curl -fsS --max-time 30 -o /tmp/belegung-roh.ics https://www.ferienhausmiete.de/41336.ics; then
            echo "Quelle: ferienhausmiete.de"
          else
            echo "Keine Kalenderquelle erreichbar – Kalender bleibt leer."
            exit 0
          fi
          mkdir -p kalender
          python3 - <<'PY'
          import re
          raw = open("/tmp/belegung-roh.ics", encoding="utf-8").read()
          raw = re.sub(r"\r?\n[ \t]", "", raw)
          lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Gaestehaus Perschall//Belegung//DE"]
          for event in re.findall(r"BEGIN:VEVENT(.*?)END:VEVENT", raw, re.S):
              start = re.search(r"^DTSTART[^:\r\n]*:(\d{8})", event, re.M)
              end = re.search(r"^DTEND[^:\r\n]*:(\d{8})", event, re.M)
              if start and end:
                  lines += ["BEGIN:VEVENT", f"DTSTART;VALUE=DATE:{start.group(1)}",
                            f"DTEND;VALUE=DATE:{end.group(1)}", "SUMMARY:Belegt", "END:VEVENT"]
          lines.append("END:VCALENDAR")
          open("kalender/belegung.ics", "w", encoding="utf-8", newline="\r\n").write("\n".join(lines) + "\n")
          print(f"{(len(lines) - 4) // 5} Belegungszeiträume übernommen")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
